name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

      # The package practising what it preaches: `EvalGateCITests` runs a real
      # golden set, renders EvalReport.markdownSummary() into this job's summary,
      # and fails the build when the gate is red. Run as its own step so the
      # gate is visible in the CI UI rather than buried in the test log.
      - name: Eval gate
        run: swift test --filter EvalGateCITests
